name: M5 deterministic evals

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  replay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -r 00-build/requirements.txt
      - name: Run unit and replay tests
        run: python -m unittest discover -s 00-build -p "test_*.py" -v
